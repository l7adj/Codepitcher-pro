name: Quality Gate

on:
  push:
    branches:
      - main
      - "redesign/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check application modules
        run: npm run check
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
